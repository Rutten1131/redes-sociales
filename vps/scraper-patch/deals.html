<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deals & Propuestas — Pipeline CRM</title>
    <link rel="stylesheet" href="/public/style.css">
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
    <style>
        /* ─── DEALS PAGE SPECIFIC STYLES ─── */
        .deals-layout {
            display: flex;
            flex-direction: column;
            height: 100%;
            overflow: hidden;
        }

        .deals-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px 28px 16px;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }

        .deals-header-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .deals-header-left h1 {
            font-size: 20px;
            font-weight: 700;
            color: var(--text-primary);
            font-family: 'Space Grotesk', sans-serif;
        }

        .deals-header-left .subtitle {
            font-size: 12px;
            color: var(--text-muted);
        }

        .deals-header-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .deals-search {
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 8px 14px 8px 36px;
            color: var(--text-primary);
            font-size: 13px;
            width: 240px;
            transition: var(--transition);
            position: relative;
        }

        .deals-search:focus {
            outline: none;
            border-color: var(--border-active);
            box-shadow: 0 0 0 3px var(--border-glow);
        }

        .search-wrapper {
            position: relative;
        }

        .search-wrapper ion-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 16px;
        }

        .btn-new-deal {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 9px 20px;
            background: linear-gradient(135deg, var(--accent), #6366f1);
            color: white;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: 0 4px 15px rgba(59,130,246,0.3);
        }

        .btn-new-deal:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(59,130,246,0.45);
        }

        /* ─── PIPELINE STATS ─── */
        .pipeline-stats {
            display: flex;
            gap: 12px;
            padding: 14px 28px;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
            overflow-x: auto;
        }

        .stat-chip {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            flex-shrink: 0;
            transition: var(--transition);
        }

        .stat-chip:hover {
            background: var(--bg-card-hover);
        }

        .stat-chip .stat-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }

        .stat-chip .stat-label {
            font-size: 11px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .stat-chip .stat-value {
            font-size: 15px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .stat-chip .stat-amount {
            font-size: 11px;
            color: var(--text-secondary);
        }

        /* ─── KANBAN BOARD ─── */
        .kanban-board {
            display: flex;
            gap: 16px;
            padding: 20px 28px;
            flex: 1;
            overflow-x: auto;
            overflow-y: hidden;
            min-height: 0;
        }

        .kanban-column {
            min-width: 280px;
            max-width: 320px;
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            overflow: hidden;
            transition: var(--transition);
        }

        .kanban-column.drag-over {
            border-color: var(--accent);
            background: rgba(59,130,246,0.05);
            box-shadow: inset 0 0 20px rgba(59,130,246,0.08);
        }

        .column-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 16px;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }

        .column-header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .column-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }

        .column-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .column-count {
            background: var(--bg-input);
            border-radius: 20px;
            padding: 2px 10px;
            font-size: 11px;
            font-weight: 600;
            color: var(--text-secondary);
        }

        .column-cards {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .column-cards::-webkit-scrollbar { width: 4px; }
        .column-cards::-webkit-scrollbar-track { background: transparent; }
        .column-cards::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

        /* ─── DEAL CARD ─── */
        .deal-card {
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 14px;
            cursor: grab;
            transition: var(--transition);
            position: relative;
        }

        .deal-card:hover {
            border-color: var(--border-active);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
        }

        .deal-card.dragging {
            opacity: 0.5;
            cursor: grabbing;
        }

        .deal-card-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 8px;
        }

        .deal-client {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
            line-height: 1.3;
        }

        .deal-amount {
            font-size: 14px;
            font-weight: 700;
            color: var(--success);
            white-space: nowrap;
        }

        .deal-service {
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 10px;
            line-height: 1.4;
        }

        .deal-meta {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        .deal-tags {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
        }

        .deal-tag {
            font-size: 10px;
            padding: 2px 8px;
            border-radius: 20px;
            font-weight: 500;
            background: var(--accent-dim);
            color: var(--accent);
        }

        .deal-tag.tag-urgente {
            background: var(--danger-dim);
            color: var(--danger);
        }

        .deal-tag.tag-web { background: rgba(99,102,241,0.15); color: #818cf8; }
        .deal-tag.tag-app { background: rgba(16,185,129,0.12); color: var(--success); }
        .deal-tag.tag-marketing { background: rgba(245,158,11,0.12); color: var(--warning); }

        .deal-followup {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 11px;
            color: var(--text-muted);
        }

        .deal-followup.overdue {
            color: var(--danger);
        }

        .deal-followup ion-icon {
            font-size: 13px;
        }

        .deal-origin-badge {
            position: absolute;
            top: 8px;
            right: 8px;
            font-size: 14px;
            opacity: 0.6;
        }

        .deal-notes-indicator {
            display: flex;
            align-items: center;
            gap: 3px;
            font-size: 11px;
            color: var(--text-muted);
        }

        .deal-notes-indicator ion-icon {
            font-size: 12px;
        }

        /* ─── EMPTY COLUMN ─── */
        .column-empty {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px;
            color: var(--text-muted);
            font-size: 12px;
            text-align: center;
            gap: 8px;
            flex: 1;
        }

        .column-empty ion-icon {
            font-size: 28px;
            opacity: 0.4;
        }

        /* ─── MODAL ─── */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(8px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            width: 90%;
            max-width: 640px;
            max-height: 85vh;
            overflow-y: auto;
            box-shadow: 0 32px 80px rgba(0,0,0,0.6);
            animation: modalIn 0.25s ease-out;
        }

        @keyframes modalIn {
            from { opacity: 0; transform: scale(0.95) translateY(10px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px 24px;
            border-bottom: 1px solid var(--border);
        }

        .modal-header h2 {
            font-size: 18px;
            font-weight: 700;
            color: var(--text-primary);
            font-family: 'Space Grotesk', sans-serif;
        }

        .modal-close {
            width: 32px; height: 32px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text-muted);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            transition: var(--transition);
        }

        .modal-close:hover {
            background: var(--danger-dim);
            color: var(--danger);
            border-color: var(--danger);
        }

        .modal-body {
            padding: 24px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 10px 14px;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            font-size: 13px;
            transition: var(--transition);
            font-family: 'Inter', sans-serif;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--border-active);
            box-shadow: 0 0 0 3px var(--border-glow);
        }

        .modal-footer {
            padding: 16px 24px;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: flex-end;
            gap: 12px;
        }

        .btn-cancel {
            padding: 9px 20px;
            background: transparent;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--text-secondary);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
        }

        .btn-cancel:hover {
            background: var(--bg-card-hover);
            color: var(--text-primary);
        }

        .btn-save {
            padding: 9px 24px;
            background: linear-gradient(135deg, var(--accent), #6366f1);
            color: white;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: 0 4px 15px rgba(59,130,246,0.3);
        }

        .btn-save:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(59,130,246,0.45);
        }

        .btn-delete {
            padding: 9px 20px;
            background: var(--danger-dim);
            border: 1px solid rgba(239,68,68,0.3);
            border-radius: var(--radius-sm);
            color: var(--danger);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
            margin-right: auto;
        }

        .btn-delete:hover {
            background: rgba(239,68,68,0.25);
        }

        /* ─── DETAIL MODAL ─── */
        .detail-modal {
            max-width: 720px;
        }

        .detail-section {
            margin-bottom: 20px;
        }

        .detail-section-title {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            margin-bottom: 10px;
            font-weight: 600;
        }

        .detail-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .detail-field {
            padding: 10px 14px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
        }

        .detail-field-label {
            font-size: 10px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }

        .detail-field-value {
            font-size: 14px;
            color: var(--text-primary);
            font-weight: 500;
        }

        .detail-field-value a {
            color: var(--accent);
            text-decoration: none;
        }

        .detail-field-value a:hover {
            text-decoration: underline;
        }

        /* Notes timeline */
        .notes-timeline {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .note-item {
            padding: 12px 14px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            position: relative;
        }

        .note-item::before {
            content: '';
            position: absolute;
            left: -6px;
            top: 16px;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--accent);
            border: 2px solid var(--bg-surface);
        }

        .note-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        .note-date {
            font-size: 11px;
            color: var(--text-muted);
        }

        .note-origin {
            font-size: 10px;
            padding: 2px 8px;
            border-radius: 20px;
            background: var(--accent-dim);
            color: var(--accent);
        }

        .note-text {
            font-size: 13px;
            color: var(--text-secondary);
            line-height: 1.5;
        }

        .add-note-form {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }

        .add-note-form textarea {
            flex: 1;
            padding: 10px 14px;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            font-size: 13px;
            font-family: 'Inter', sans-serif;
            resize: none;
            height: 38px;
            transition: var(--transition);
        }

        .add-note-form textarea:focus {
            outline: none;
            border-color: var(--border-active);
            height: 80px;
        }

        .add-note-btn {
            padding: 8px 16px;
            background: var(--accent-dim);
            border: 1px solid rgba(59,130,246,0.3);
            border-radius: var(--radius-sm);
            color: var(--accent);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
            white-space: nowrap;
            align-self: flex-end;
        }

        .add-note-btn:hover {
            background: rgba(59,130,246,0.25);
        }

        /* Files list */
        .files-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .file-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
        }

        .file-item ion-icon {
            font-size: 18px;
            color: var(--accent);
        }

        .file-item a {
            color: var(--text-primary);
            text-decoration: none;
            font-size: 13px;
            flex: 1;
        }

        .file-item a:hover {
            color: var(--accent);
        }

        .add-file-row {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }

        .add-file-row input {
            flex: 1;
            padding: 8px 12px;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            font-size: 12px;
        }

        .add-file-row input:focus {
            outline: none;
            border-color: var(--border-active);
        }

        /* Status select in detail */
        .status-select-wrapper {
            position: relative;
        }

        .status-select-wrapper select {
            padding: 8px 14px;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            font-size: 13px;
            width: 100%;
            cursor: pointer;
        }

        /* Responsive */
        @media (max-width: 900px) {
            .kanban-board {
                padding: 12px;
            }
            .kanban-column {
                min-width: 260px;
            }
            .form-row {
                grid-template-columns: 1fr;
            }
            .deals-header {
                flex-wrap: wrap;
                gap: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="background">
        <div class="sphere sphere-1"></div>
        <div class="sphere sphere-2"></div>
        <div class="sphere sphere-3"></div>
    </div>

    <div class="glass-container">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="sidebar-logo">O</div>
            <a href="/" class="icon-btn" title="Motor de Adquisición">
                <ion-icon name="search-outline"></ion-icon>
            </a>
            <a href="/centro" class="icon-btn" title="Centro de Llamadas / CRM">
                <ion-icon name="call-outline"></ion-icon>
            </a>
            <a href="/bd" class="icon-btn" title="Editor de Prospectos (Sheets)">
                <ion-icon name="grid-outline"></ion-icon>
            </a>
            <a href="/enriquecer" class="icon-btn" title="Enriquecer Lista (RADAR)">
                <ion-icon name="color-wand-outline"></ion-icon>
            </a>
            <a href="/campanas" class="icon-btn" title="Gestor de Campañas & Calendario">
                <ion-icon name="mail-outline"></ion-icon>
            </a>
            <a href="/deals" class="icon-btn active" title="Deals & Propuestas">
                <ion-icon name="briefcase-outline"></ion-icon>
            </a>
            <div class="icon-btn" title="Configuración" style="margin-top:auto;">
                <ion-icon name="settings-outline"></ion-icon>
            </div>
        </div>

        <div class="main-content" style="display:flex;flex-direction:column;overflow:hidden;">
            <!-- Deals Header -->
            <div class="deals-header">
                <div class="deals-header-left">
                    <div>
                        <h1>💼 Deals & Propuestas</h1>
                        <div class="subtitle">Pipeline de proyectos · Gestión de cotizaciones y seguimiento</div>
                    </div>
                </div>
                <div class="deals-header-right">
                    <div class="search-wrapper">
                        <ion-icon name="search-outline"></ion-icon>
                        <input type="text" class="deals-search" id="searchDeals" placeholder="Buscar por cliente, servicio...">
                    </div>
                    <button class="btn-new-deal" id="btnNewDeal" onclick="openNewDealModal()">
                        <ion-icon name="add-circle-outline"></ion-icon>
                        Nuevo Deal
                    </button>
                </div>
            </div>

            <!-- Pipeline Stats -->
            <div class="pipeline-stats" id="pipelineStats">
                <!-- Populated by JS -->
            </div>

            <!-- Kanban Board -->
            <div class="kanban-board" id="kanbanBoard">
                <!-- Populated by JS -->
            </div>
        </div>
    </div>

    <!-- New Deal Modal -->
    <div class="modal-overlay" id="newDealModal">
        <div class="modal">
            <div class="modal-header">
                <h2>✨ Nuevo Deal</h2>
                <button class="modal-close" onclick="closeNewDealModal()">✕</button>
            </div>
            <div class="modal-body">
                <div class="form-row">
                    <div class="form-group">
                        <label>Cliente</label>
                        <input type="text" id="newDealCliente" placeholder="Nombre del cliente">
                    </div>
                    <div class="form-group">
                        <label>Teléfono</label>
                        <input type="text" id="newDealTelefono" placeholder="+593...">
                    </div>
                </div>
                <div class="form-group">
                    <label>Servicio / Proyecto</label>
                    <input type="text" id="newDealServicio" placeholder="Ej: Sitio web corporativo, App móvil...">
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Monto Estimado (USD)</label>
                        <input type="number" id="newDealMonto" placeholder="2500" min="0" step="50">
                    </div>
                    <div class="form-group">
                        <label>Fecha de Seguimiento</label>
                        <input type="date" id="newDealSeguimiento">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Link Propuesta</label>
                        <input type="url" id="newDealLinkPropuesta" placeholder="https://...">
                    </div>
                    <div class="form-group">
                        <label>Link MVP / Demo</label>
                        <input type="url" id="newDealLinkMvp" placeholder="https://...">
                    </div>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="newDealEmail" placeholder="cliente@email.com">
                </div>
                <div class="form-group">
                    <label>Tags (separadas por coma)</label>
                    <input type="text" id="newDealTags" placeholder="web, urgente, marketing">
                </div>
                <div class="form-group">
                    <label>Notas iniciales</label>
                    <textarea id="newDealNotas" placeholder="Detalles de la conversación, requerimientos..."></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-cancel" onclick="closeNewDealModal()">Cancelar</button>
                <button class="btn-save" onclick="saveDeal()">
                    <ion-icon name="checkmark-circle-outline"></ion-icon>
                    Crear Deal
                </button>
            </div>
        </div>
    </div>

    <!-- Deal Detail Modal -->
    <div class="modal-overlay" id="detailDealModal">
        <div class="modal detail-modal">
            <div class="modal-header">
                <h2 id="detailTitle">Detalle del Deal</h2>
                <button class="modal-close" onclick="closeDetailModal()">✕</button>
            </div>
            <div class="modal-body" id="detailBody">
                <!-- Populated by JS -->
            </div>
            <div class="modal-footer">
                <button class="btn-delete" onclick="deleteDeal()">
                    <ion-icon name="trash-outline"></ion-icon>
                    Eliminar
                </button>
                <button class="btn-cancel" onclick="closeDetailModal()">Cerrar</button>
                <button class="btn-save" onclick="saveDetailChanges()">
                    Guardar Cambios
                </button>
            </div>
        </div>
    </div>

    <script>
    // ─── CONFIG ───
    const API_BASE = '';
    const COLUMNS = [
        { id: 'contacto_inicial', title: 'Contacto Inicial', color: '#3b82f6', icon: '📞' },
        { id: 'propuesta_enviada', title: 'Propuesta Enviada', color: '#8b5cf6', icon: '📄' },
        { id: 'en_negociacion', title: 'En Negociación', color: '#f59e0b', icon: '🤝' },
        { id: 'cerrado_ganado', title: 'Cerrado Ganado', color: '#10b981', icon: '🏆' },
        { id: 'cerrado_perdido', title: 'Cerrado Perdido', color: '#ef4444', icon: '❌' }
    ];

    let deals = [];
    let currentDetailDeal = null;

    // ─── API CALLS ───
    async function fetchDeals(search = '') {
        try {
            const url = search ? `${API_BASE}/api/deals?search=${encodeURIComponent(search)}` : `${API_BASE}/api/deals`;
            const r = await fetch(url);
            if (!r.ok) throw new Error('Error fetching deals');
            deals = await r.json();
            renderBoard();
            renderStats();
        } catch (e) {
            console.error('Error loading deals:', e);
        }
    }

    async function createDeal(data) {
        const r = await fetch(`${API_BASE}/api/deals`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        });
        if (!r.ok) throw new Error('Error creating deal');
        return r.json();
    }

    async function updateDeal(id, data) {
        const r = await fetch(`${API_BASE}/api/deals/${id}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        });
        if (!r.ok) throw new Error('Error updating deal');
        return r.json();
    }

    async function apiDeleteDeal(id) {
        const r = await fetch(`${API_BASE}/api/deals/${id}`, { method: 'DELETE' });
        if (!r.ok) throw new Error('Error deleting deal');
        return r.json();
    }

    async function addNote(dealId, texto) {
        const r = await fetch(`${API_BASE}/api/deals/${dealId}/notes`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ texto, origen: 'web' })
        });
        if (!r.ok) throw new Error('Error adding note');
        return r.json();
    }

    async function addFile(dealId, nombre, url) {
        const r = await fetch(`${API_BASE}/api/deals/${dealId}/files`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ nombre, url })
        });
        if (!r.ok) throw new Error('Error adding file');
        return r.json();
    }

    // ─── RENDER ───
    function renderBoard() {
        const board = document.getElementById('kanbanBoard');
        const search = document.getElementById('searchDeals').value.toLowerCase();
        
        const filtered = search
            ? deals.filter(d => 
                (d.cliente || '').toLowerCase().includes(search) ||
                (d.servicio || '').toLowerCase().includes(search) ||
                (d.tags || []).some(t => t.toLowerCase().includes(search))
              )
            : deals;

        board.innerHTML = COLUMNS.map(col => {
            const colDeals = filtered.filter(d => d.status === col.id);
            return `
                <div class="kanban-column" data-status="${col.id}"
                     ondragover="handleDragOver(event)" ondragleave="handleDragLeave(event)" ondrop="handleDrop(event)">
                    <div class="column-header">
                        <div class="column-header-left">
                            <div class="column-dot" style="background:${col.color}"></div>
                            <span class="column-title">${col.icon} ${col.title}</span>
                        </div>
                        <span class="column-count">${colDeals.length}</span>
                    </div>
                    <div class="column-cards">
                        ${colDeals.length === 0 ? `
                            <div class="column-empty">
                                <ion-icon name="folder-open-outline"></ion-icon>
                                <span>Sin deals aquí</span>
                            </div>
                        ` : colDeals.map(d => renderDealCard(d)).join('')}
                    </div>
                </div>
            `;
        }).join('');
    }

    function renderDealCard(deal) {
        const originEmoji = { telegram: '🤖', web: '🌐', whatsapp: '📱' };
        const followup = deal.fecha_seguimiento ? new Date(deal.fecha_seguimiento) : null;
        const isOverdue = followup && followup < new Date();
        const followupStr = followup ? followup.toLocaleDateString('es-EC', { day: 'numeric', month: 'short' }) : '';

        return `
            <div class="deal-card" draggable="true" data-id="${deal.id}"
                 ondragstart="handleDragStart(event)" onclick="openDetailModal('${deal.id}')">
                ${deal.origen ? `<span class="deal-origin-badge">${originEmoji[deal.origen] || '📋'}</span>` : ''}
                <div class="deal-card-top">
                    <span class="deal-client">${escapeHtml(deal.cliente || 'Sin nombre')}</span>
                    <span class="deal-amount">${deal.monto ? '$' + Number(deal.monto).toLocaleString() : ''}</span>
                </div>
                <div class="deal-service">${escapeHtml(deal.servicio || '')}</div>
                <div class="deal-meta">
                    <div class="deal-tags">
                        ${(deal.tags || []).slice(0, 3).map(t => `<span class="deal-tag tag-${t.toLowerCase().replace(/\s/g,'')}">${escapeHtml(t)}</span>`).join('')}
                    </div>
                    <div style="display:flex;gap:10px;align-items:center;">
                        ${(deal.notas || []).length > 0 ? `
                            <span class="deal-notes-indicator">
                                <ion-icon name="chatbubble-outline"></ion-icon> ${deal.notas.length}
                            </span>
                        ` : ''}
                        ${followupStr ? `
                            <span class="deal-followup ${isOverdue ? 'overdue' : ''}">
                                <ion-icon name="calendar-outline"></ion-icon> ${followupStr}
                            </span>
                        ` : ''}
                    </div>
                </div>
            </div>
        `;
    }

    function renderStats() {
        const stats = document.getElementById('pipelineStats');
        const totalAmount = deals.reduce((sum, d) => sum + (Number(d.monto) || 0), 0);
        
        let html = `
            <div class="stat-chip">
                <div class="stat-dot" style="background:var(--accent)"></div>
                <div>
                    <div class="stat-label">Total Pipeline</div>
                    <div class="stat-value">${deals.length}</div>
                </div>
                <div class="stat-amount">$${totalAmount.toLocaleString()}</div>
            </div>
        `;

        COLUMNS.forEach(col => {
            const colDeals = deals.filter(d => d.status === col.id);
            const colAmount = colDeals.reduce((sum, d) => sum + (Number(d.monto) || 0), 0);
            html += `
                <div class="stat-chip">
                    <div class="stat-dot" style="background:${col.color}"></div>
                    <div>
                        <div class="stat-label">${col.title}</div>
                        <div class="stat-value">${colDeals.length}</div>
                    </div>
                    ${colAmount > 0 ? `<div class="stat-amount">$${colAmount.toLocaleString()}</div>` : ''}
                </div>
            `;
        });

        stats.innerHTML = html;
    }

    // ─── DRAG & DROP ───
    let draggedDealId = null;

    function handleDragStart(e) {
        draggedDealId = e.target.closest('.deal-card').dataset.id;
        e.target.closest('.deal-card').classList.add('dragging');
        e.dataTransfer.effectAllowed = 'move';
    }

    function handleDragOver(e) {
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
        e.currentTarget.classList.add('drag-over');
    }

    function handleDragLeave(e) {
        e.currentTarget.classList.remove('drag-over');
    }

    async function handleDrop(e) {
        e.preventDefault();
        e.currentTarget.classList.remove('drag-over');
        const newStatus = e.currentTarget.dataset.status;
        if (!draggedDealId || !newStatus) return;

        try {
            await updateDeal(draggedDealId, { status: newStatus });
            await fetchDeals();
        } catch (err) {
            console.error('Error moving deal:', err);
        }
        draggedDealId = null;
    }

    // ─── NEW DEAL MODAL ───
    function openNewDealModal() {
        document.getElementById('newDealModal').classList.add('active');
        document.getElementById('newDealCliente').focus();
    }

    function closeNewDealModal() {
        document.getElementById('newDealModal').classList.remove('active');
        ['newDealCliente','newDealTelefono','newDealServicio','newDealMonto',
         'newDealSeguimiento','newDealLinkPropuesta','newDealLinkMvp','newDealEmail','newDealTags','newDealNotas'
        ].forEach(id => { document.getElementById(id).value = ''; });
    }

    async function saveDeal() {
        const cliente = document.getElementById('newDealCliente').value.trim();
        if (!cliente) { alert('El nombre del cliente es obligatorio'); return; }

        const data = {
            cliente,
            telefono: document.getElementById('newDealTelefono').value.trim(),
            servicio: document.getElementById('newDealServicio').value.trim(),
            monto: parseFloat(document.getElementById('newDealMonto').value) || 0,
            fecha_seguimiento: document.getElementById('newDealSeguimiento').value || null,
            link_propuesta: document.getElementById('newDealLinkPropuesta').value.trim() || '',
            link_mvp: document.getElementById('newDealLinkMvp').value.trim() || '',
            email: document.getElementById('newDealEmail').value.trim() || '',
            tags: document.getElementById('newDealTags').value.split(',').map(t => t.trim()).filter(Boolean),
            notas_inicial: document.getElementById('newDealNotas').value.trim() || '',
            origen: 'web'
        };

        try {
            await createDeal(data);
            closeNewDealModal();
            await fetchDeals();
        } catch (e) {
            alert('Error al crear deal: ' + e.message);
        }
    }

    // ─── DETAIL MODAL ───
    function openDetailModal(dealId) {
        currentDetailDeal = deals.find(d => d.id === dealId);
        if (!currentDetailDeal) return;
        
        const d = currentDetailDeal;
        document.getElementById('detailTitle').textContent = `💼 ${d.cliente || 'Deal'}`;
        
        const body = document.getElementById('detailBody');
        body.innerHTML = `
            <div class="detail-section">
                <div class="detail-section-title">Información del Deal</div>
                <div class="detail-grid">
                    <div class="detail-field">
                        <div class="detail-field-label">Cliente</div>
                        <div class="detail-field-value">${escapeHtml(d.cliente || '-')}</div>
                    </div>
                    <div class="detail-field">
                        <div class="detail-field-label">Teléfono</div>
                        <div class="detail-field-value">${d.telefono ? `<a href="tel:${d.telefono}">${escapeHtml(d.telefono)}</a>` : '-'}</div>
                    </div>
                    <div class="detail-field">
                        <div class="detail-field-label">Email</div>
                        <div class="detail-field-value">${d.email ? `<a href="mailto:${d.email}">${escapeHtml(d.email)}</a>` : '-'}</div>
                    </div>
                    <div class="detail-field">
                        <div class="detail-field-label">Monto</div>
                        <div class="detail-field-value" style="color:var(--success);font-weight:700;">${d.monto ? '$' + Number(d.monto).toLocaleString() : '-'}</div>
                    </div>
                    <div class="detail-field" style="grid-column:span 2;">
                        <div class="detail-field-label">Servicio / Proyecto</div>
                        <div class="detail-field-value">${escapeHtml(d.servicio || '-')}</div>
                    </div>
                </div>
            </div>

            <div class="detail-section">
                <div class="detail-section-title">Estado & Seguimiento</div>
                <div class="detail-grid">
                    <div class="form-group" style="margin-bottom:0;">
                        <label>Estado</label>
                        <select id="detailStatus">
                            ${COLUMNS.map(c => `<option value="${c.id}" ${d.status === c.id ? 'selected' : ''}>${c.icon} ${c.title}</option>`).join('')}
                        </select>
                    </div>
                    <div class="form-group" style="margin-bottom:0;">
                        <label>Fecha de Seguimiento</label>
                        <input type="date" id="detailSeguimiento" value="${d.fecha_seguimiento || ''}">
                    </div>
                </div>
            </div>

            <div class="detail-section">
                <div class="detail-section-title">Links</div>
                <div class="detail-grid">
                    <div class="detail-field">
                        <div class="detail-field-label">Propuesta</div>
                        <div class="detail-field-value">${d.link_propuesta ? `<a href="${d.link_propuesta}" target="_blank">📄 Ver propuesta →</a>` : '-'}</div>
                    </div>
                    <div class="detail-field">
                        <div class="detail-field-label">MVP / Demo</div>
                        <div class="detail-field-value">${d.link_mvp ? `<a href="${d.link_mvp}" target="_blank">🚀 Ver demo →</a>` : '-'}</div>
                    </div>
                </div>
            </div>

            <div class="detail-section">
                <div class="detail-section-title">Archivos & Links Adjuntos</div>
                <div class="files-list" id="filesList">
                    ${(d.archivos || []).map(f => `
                        <div class="file-item">
                            <ion-icon name="document-outline"></ion-icon>
                            <a href="${f.url}" target="_blank">${escapeHtml(f.nombre)}</a>
                        </div>
                    `).join('') || '<div style="color:var(--text-muted);font-size:12px;">Sin archivos adjuntos</div>'}
                </div>
                <div class="add-file-row">
                    <input type="text" id="newFileName" placeholder="Nombre del archivo">
                    <input type="url" id="newFileUrl" placeholder="https://link-al-archivo...">
                    <button class="add-note-btn" onclick="handleAddFile()">+ Adjuntar</button>
                </div>
            </div>

            <div class="detail-section">
                <div class="detail-section-title">Conversaciones & Notas</div>
                <div class="notes-timeline" id="notesTimeline">
                    ${(d.notas || []).map(n => `
                        <div class="note-item">
                            <div class="note-meta">
                                <span class="note-date">${n.fecha ? new Date(n.fecha).toLocaleString('es-EC', {day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}) : ''}</span>
                                <span class="note-origin">${n.origen || 'web'}</span>
                            </div>
                            <div class="note-text">${escapeHtml(n.texto || '')}</div>
                        </div>
                    `).join('') || '<div style="color:var(--text-muted);font-size:12px;">Sin notas todavía</div>'}
                </div>
                <div class="add-note-form">
                    <textarea id="newNoteText" placeholder="Escribe una nota..."></textarea>
                    <button class="add-note-btn" onclick="handleAddNote()">Agregar</button>
                </div>
            </div>

            <div class="detail-section">
                <div class="detail-section-title">Información Adicional</div>
                <div class="detail-grid">
                    <div class="detail-field">
                        <div class="detail-field-label">Origen</div>
                        <div class="detail-field-value">${d.origen || '-'}</div>
                    </div>
                    <div class="detail-field">
                        <div class="detail-field-label">Creado</div>
                        <div class="detail-field-value">${d.fecha_creacion ? new Date(d.fecha_creacion).toLocaleDateString('es-EC') : '-'}</div>
                    </div>
                </div>
            </div>
        `;

        document.getElementById('detailDealModal').classList.add('active');
    }

    function closeDetailModal() {
        document.getElementById('detailDealModal').classList.remove('active');
        currentDetailDeal = null;
    }

    async function saveDetailChanges() {
        if (!currentDetailDeal) return;
        const data = {
            status: document.getElementById('detailStatus').value,
            fecha_seguimiento: document.getElementById('detailSeguimiento').value || null
        };
        try {
            await updateDeal(currentDetailDeal.id, data);
            closeDetailModal();
            await fetchDeals();
        } catch (e) {
            alert('Error: ' + e.message);
        }
    }

    async function deleteDeal() {
        if (!currentDetailDeal) return;
        if (!confirm(`¿Eliminar el deal de "${currentDetailDeal.cliente}"?`)) return;
        try {
            await apiDeleteDeal(currentDetailDeal.id);
            closeDetailModal();
            await fetchDeals();
        } catch (e) {
            alert('Error: ' + e.message);
        }
    }

    async function handleAddNote() {
        if (!currentDetailDeal) return;
        const text = document.getElementById('newNoteText').value.trim();
        if (!text) return;
        try {
            await addNote(currentDetailDeal.id, text);
            await fetchDeals();
            openDetailModal(currentDetailDeal.id);
        } catch (e) {
            alert('Error: ' + e.message);
        }
    }

    async function handleAddFile() {
        if (!currentDetailDeal) return;
        const nombre = document.getElementById('newFileName').value.trim();
        const url = document.getElementById('newFileUrl').value.trim();
        if (!nombre || !url) { alert('Nombre y URL son requeridos'); return; }
        try {
            await addFile(currentDetailDeal.id, nombre, url);
            await fetchDeals();
            openDetailModal(currentDetailDeal.id);
        } catch (e) {
            alert('Error: ' + e.message);
        }
    }

    // ─── UTILS ───
    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    // ─── SEARCH ───
    let searchTimeout;
    document.getElementById('searchDeals').addEventListener('input', (e) => {
        clearTimeout(searchTimeout);
        searchTimeout = setTimeout(() => {
            renderBoard();
        }, 300);
    });

    // Close modals on overlay click
    document.querySelectorAll('.modal-overlay').forEach(overlay => {
        overlay.addEventListener('click', (e) => {
            if (e.target === overlay) {
                overlay.classList.remove('active');
                currentDetailDeal = null;
            }
        });
    });

    // Close modals on Escape
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
            document.querySelectorAll('.modal-overlay.active').forEach(m => m.classList.remove('active'));
            currentDetailDeal = null;
        }
    });

    // ─── INIT ───
    fetchDeals();
    </script>
</body>
</html>
